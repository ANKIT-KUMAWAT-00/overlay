[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omniassist"
version = "1.0.0"
description = "Universal Cross-Platform Python-Based AI Computer Interaction Assistant"
readme = "README.md"
authors = [{ name = "OmniAssist Team" }]
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
    "pynput>=1.7.6",
    "pyautogui>=0.9.54",
    "pyperclip>=1.8.2",
    "mss>=9.0.1",
    "Pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "google-genai>=1.0.0",
    "pydantic>=2.5.0",
    "keyring>=24.0.0",
    "pyobjc-core>=9.0; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=9.0; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=9.0; sys_platform == 'darwin'",
    "psutil>=5.9.0; sys_platform == 'win32'",
    "uiautomation>=2.0.18; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.12.0",
    "pyinstaller>=6.3.0",
]

[project.scripts]
omniassist = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
